<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fond circulaire marine -->
  <circle cx="32" cy="32" r="30" fill="#0B1B33" stroke="#F2B705" stroke-width="2"/>
  
  <!-- Liseré tricolore guinéen en arc supérieur -->
  <path d="M12 20 A 24 24 0 0 1 25 10" stroke="#D52B1E" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 9.5 A 24 24 0 0 1 38 9.5" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/>
  <path d="M39 10 A 24 24 0 0 1 52 20" stroke="#00A651" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Volant / Roue stylisée -->
  <circle cx="32" cy="34" r="14" stroke="#F2B705" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="34" r="4" fill="#F2B705"/>
  <line x1="32" y1="20" x2="32" y2="30" stroke="#F2B705" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="38" x2="29" y2="35" stroke="#F2B705" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="38" x2="35" y2="35" stroke="#F2B705" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Texte SAM -->
  <text x="32" y="55" font-family="'Poppins', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SAM</text>
</svg>
